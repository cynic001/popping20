<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>팝핑 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overscroll-behavior: none; touch-action: manipulation;
    font-family: 'Nunito', sans-serif;
    background: #FDFBF7;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: inherit;
  }
  #bgm-toggle {
    position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px;
    z-index: 999; width: 30px; height: 30px; border-radius: 10px;
    background: rgba(255,255,255,0.55); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #bgm-toggle svg { width: 15px; height: 15px; }

  .record-modal {
    position: absolute; inset: 0; z-index: 2000;
    background: rgba(38,34,42,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .record-modal.hidden { display: none; }
  .record-modal-card {
    position: relative; background: #FFF6EE; border-radius: 20px;
    padding: 26px 22px 22px; width: 100%; max-width: 340px;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    display: flex; flex-direction: column; align-items: center;
  }
  .record-modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 28px; height: 28px; border-radius: 9px;
    background: rgba(0,0,0,0.06); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .record-modal-close svg { width: 14px; height: 14px; }
  .record-modal-title {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 17px;
    color: #3A3944; margin-bottom: 14px;
  }
  /* 태블릿(가로/세로 상관없이 짧은 변 기준 600px 이상): 고정 비율 프레임 + 배율 확대 */
  body.tablet-frame {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
  }
  body.tablet-frame #app {
    inset: auto;
    top: 50%; left: 50%;
    width: 430px; height: 900px;
    transform-origin: center center;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.22);
  }
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  .scene.hidden { opacity: 0; pointer-events: none; }

  /* ---------- 타이틀 화면 ---------- */
  #scene-title {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
  }

  .sparkle {
    position: absolute; font-size: 18px; color: #F0C7C7; opacity: 0.9;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  .sparkle.b { color: #B5EAD7; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

  .logo-wrap { position: relative; text-align: center; margin-top: -6vh; }
  .logo-firework { position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; }
  .firework-particle {
    position: absolute; top: 0; left: 0; border-radius: 50%;
    opacity: 0; pointer-events: none;
    box-shadow: 0 0 6px 1px currentColor;
    animation: fireworkBurst 1.2s cubic-bezier(0.15, 0.7, 0.3, 1) both;
  }
  @keyframes fireworkBurst {
    0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
    10% { transform: translate(calc(var(--fx) * 0.15), calc(var(--fy) * 0.15)) scale(1.3); opacity: 1; }
    65% { transform: translate(calc(var(--fx) * 0.85), calc(var(--fy) * 0.85)) scale(1); opacity: 1; }
    100% { transform: translate(var(--fx), var(--fy)) scale(0.5); opacity: 0; }
  }
  .logo-bounce {
    position: relative; z-index: 1;
    display: inline-block;
    animation: logoBounceIn 0.9s cubic-bezier(0.34, 1.2, 0.4, 1) both;
  }
  @keyframes logoBounceIn {
    0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
    50% { transform: scale(1.15) rotate(4deg); opacity: 1; }
    68% { transform: scale(0.93) rotate(-3deg); }
    84% { transform: scale(1.05) rotate(1.5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .tagline-arc {
    margin-top: 2px;
    opacity: 0;
    animation: taglinePopIn 0.5s ease-out 0.85s both;
  }
  @keyframes taglinePopIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .tagline-arc svg { display: block; margin: 0 auto; width: 220px; height: 34px; }
  @media (min-width: 500px) { .tagline-arc svg { width: 260px; height: 38px; } }
  .bubble-line { line-height: 1; margin: 0; }
  .logo-image {
    display: block; margin: 0 auto;
    width: min(78vw, 340px); height: auto;
  }
  .bubbleletter {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    -webkit-text-stroke: 2.5px #3A3944;
    text-shadow: 0 4px 0 rgba(0,0,0,0.12);
    font-size: 18vw;
  }
  @media (min-width: 500px) { .bubbleletter { font-size: 78px; } }
  .bubbleletter.big { font-size: 21vw; }
  @media (min-width: 500px) { .bubbleletter.big { font-size: 90px; } }

  .logo-badge {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-family: 'Baloo 2', sans-serif; color: #3A3944; font-size: 12px;
  }

  .stage {
    position: relative; width: min(90vw, 420px); height: 42vh; margin-top: 2vh;
  }

  .mascot {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 30vw; max-width: 132px; height: 30vw; max-height: 132px;
    border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle at 35% 28%, #FFD9D5, #FFB7B2 55%, #E8938C 100%);
    border: 3px solid #D97C74;
    box-shadow: 3px 8px 14px rgba(90,70,60,0.32);
    animation: bounce 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    z-index: 3;
  }
  .mascot::before, .mascot::after {
    content: ''; position: absolute; width: 8%; height: 8%; border-radius: 50%; background: #5D5C61;
    top: 34%;
  }
  .mascot::before { left: 26%; }
  .mascot::after { left: 60%; }
  .mascot-mouth {
    position: absolute; left: 30%; top: 48%; width: 40%; height: 16%;
    border: 3px solid #5D5C61; border-top: none; border-radius: 0 0 50% 50%;
  }
  @keyframes bounce {
    0% { transform: translate(-50%, -50%) translateY(0) scale(1, 1); }
    10% { transform: translate(-50%, -50%) translateY(2px) scale(1.06, 0.9); }
    30% { transform: translate(-50%, -50%) translateY(-22px) scale(0.94, 1.08); }
    50% { transform: translate(-50%, -50%) translateY(0) scale(1.07, 0.88); }
    65% { transform: translate(-50%, -50%) translateY(-6px) scale(0.98, 1.02); }
    80% { transform: translate(-50%, -50%) translateY(0) scale(1.02, 0.98); }
    100% { transform: translate(-50%, -50%) translateY(0) scale(1, 1); }
  }

  .num-bubble {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #5D5C61; font-family: 'Baloo 2', sans-serif;
    box-sizing: border-box; border: 2px solid transparent;
    box-shadow: 2px 4px 8px rgba(90,70,60,0.25);
    animation: pop 3.2s ease-in-out infinite;
  }
  @keyframes pop {
    0%, 60% { transform: scale(1); opacity: 1; }
    72% { transform: scale(1.18); opacity: 1; }
    82% { transform: scale(0.2); opacity: 0.4; }
    100% { transform: scale(0); opacity: 0; }
  }
  .particle {
    position: absolute; border-radius: 50%; top: 50%; left: 50%;
    animation: spark 3.2s ease-in-out infinite;
  }
  @keyframes spark {
    0%, 75% { opacity: 0; transform: translate(0,0) scale(0); }
    85% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
    100% { opacity: 0; transform: translate(calc(var(--tx) * 1.8), calc(var(--ty) * 1.8)) scale(0.4); }
  }

  .cta {
    margin-top: -1vh; font-size: 13px; color: #3A3944; font-weight: 700;
    animation: fade 1.8s ease-in-out infinite;
  }
  @keyframes fade { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  .hub-link a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #5D5C61; opacity: 0.7; text-decoration: none;
  }

  .bottom-stack {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom));
    left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .logout-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.6); border: none; border-radius: 10px;
    padding: 7px 11px; font-size: 12px; font-weight: 700; color: #5D5C61;
    font-family: 'Nunito', sans-serif; cursor: pointer;
  }
  .logout-btn svg { width: 14px; height: 14px; }

  /* 세로 공간이 좁은 기기(구형 폰 등)에서 타이틀 화면 콘텐츠가
     하단 로그아웃/허브 링크와 겹치지 않도록 압축 레이아웃 적용 */
  @media (max-height: 600px) {
    .logo-wrap { margin-top: -2vh; }
    .stage { height: 32vh; margin-top: 0; }
    .cta { margin-top: 0; }
    .bottom-stack { gap: 12px; bottom: max(10px, env(safe-area-inset-bottom)); }
  }

  /* ---------- 모드 선택 화면 ---------- */
  #scene-mode, #scene-nickname, #scene-record {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
    align-items: stretch; justify-content: flex-start;
  }
  .panel {
    width: 100%; max-width: 420px; margin: 0 auto;
    height: 100%; padding: max(20px, env(safe-area-inset-top)) 18px 20px;
    box-sizing: border-box; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .panel-topbar {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0;
  }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,0.6);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .panel-title { font-weight: 800; color: #3A3944; font-size: 17px; font-family: 'Baloo 2', sans-serif; }
  .panel-sub { text-align: center; font-size: 13px; color: #5D5C61; opacity: 0.65; margin-bottom: 16px; }

  .section-title { text-align: left; font-size: 15px; font-weight: 800; margin-bottom: 8px; font-family: 'Baloo 2', sans-serif; }
  .section-title.solo { color: #D4553F; }
  .section-title.duo { color: #3E9E7C; margin-top: 18px; }

  .mode-card {
    background: #fff; border: none; width: 100%; text-align: left; cursor: pointer;
    border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04); margin-bottom: 8px; font-family: 'Nunito', sans-serif;
  }
  .mode-icon {
    width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mode-icon svg { width: 21px; height: 21px; }
  .mode-name { font-weight: 800; font-size: 16px; color: #3A3944; }
  .mode-desc { font-size: 12px; color: #5D5C61; opacity: 0.65; margin-top: 2px; }

  .record-cta { margin-top: 18px; text-align: center; }
  .record-cta button {
    background: #3A3944; color: #fff; border: none; border-radius: 14px;
    padding: 12px 24px; font-weight: 700; font-size: 15px; font-family: 'Nunito', sans-serif; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .record-cta button svg { width: 17px; height: 17px; flex-shrink: 0; }

  /* ---------- 닉네임 / 기록 스텁 ---------- */
  .stub-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 12px; }
  .stub-body p { font-size: 15px; color: #3A3944; margin: 0; }
  .nickname-input {
    width: 100%; max-width: 220px; padding: 12px 14px; border-radius: 12px;
    border: none; font-size: 16px; font-family: 'Nunito', sans-serif; text-align: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.06);
  }
  .stub-body button.primary {
    background: #FFB7B2; color: #3A3944; border: none; border-radius: 14px;
    padding: 12px 28px; font-weight: 800; font-size: 15px; font-family: 'Baloo 2', sans-serif; cursor: pointer;
  }

  .record-nickname { font-size: 13px; color: #5D5C61; opacity: 0.7; margin-bottom: 8px; }
  .record-card {
    background: #fff; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 280px; box-shadow: 0 2px 0 rgba(0,0,0,0.04); margin-bottom: 10px;
  }
  .record-icon {
    width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-sizing: border-box;
  }
  .record-icon svg { width: 20px; height: 20px; }
  .record-name { font-weight: 800; font-size: 13px; color: #3A3944; }
  .record-value { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; color: #3A3944; margin-top: 2px; }
  .record-empty { font-size: 13px; color: #5D5C61; opacity: 0.65; }

  .record-divider {
    width: 100%; max-width: 280px; height: 1px;
    background: rgba(0,0,0,0.08); margin: 14px 0;
  }
  .record-section-title {
    width: 100%; max-width: 280px; text-align: left;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 14px;
    color: #3A3944; margin-bottom: 8px;
  }
  .record-tabs {
    width: 100%; max-width: 280px; display: flex; gap: 6px; margin-bottom: 8px;
  }
  .record-tab {
    flex: 1; border: none; border-radius: 10px; padding: 7px 0;
    font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
    background: rgba(0,0,0,0.05); color: #5D5C61; cursor: pointer;
  }
  .record-tab.active { background: #3A3944; color: #fff; }
  .record-list {
    width: 100%; max-width: 280px; max-height: 220px; overflow-y: auto;
    background: #fff; border-radius: 12px; padding: 4px 12px;
    box-sizing: border-box;
  }
  .record-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
    font-family: 'Nunito', sans-serif;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row.me { background: rgba(255,183,178,0.15); margin: 0 -12px; padding: 8px 12px; border-radius: 8px; }
  .record-rank {
    width: 20px; flex-shrink: 0; text-align: center; font-weight: 800;
    font-family: 'Baloo 2', sans-serif; font-size: 12px; color: #5D5C61;
  }
  .record-row-nick { flex: 1; font-size: 13px; color: #3A3944; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .record-row-value { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 13px; color: #3A3944; }

  /* ---------- 타임 어택 게임 화면 ---------- */
  #scene-game {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
    align-items: stretch; justify-content: flex-start;
  }
  .game-wrap { position: relative; display: flex; flex-direction: column; height: 100%; }
  .pause-btn {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px;
    width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.65);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6;
  }
  .pause-btn svg { width: 15px; height: 15px; }
  .game-hud {
    display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;
    padding: max(14px, env(safe-area-inset-top)) 16px 4px;
  }
  .timer-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .timer-ring {
    position: absolute; left: 50%; top: 50%; width: 82px; height: 36px;
    margin-left: -41px; margin-top: -18px; border-radius: 18px; border: 2px solid transparent;
    pointer-events: none;
  }
  .timer-ring.warn { border-color: #E2A13A; animation: ringPulse 1.3s ease-out infinite; }
  .timer-ring.danger { border-color: #D4553F; animation: ringPulse 0.7s ease-out infinite; }
  @keyframes ringPulse { 0% { opacity: 0.55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
  .game-timer {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #3A3944;
    position: relative; transition: color 0.25s ease;
  }
  .game-timer.pulse-calm { animation: pulseCalm 2.4s ease-in-out infinite; }
  .game-timer.pulse-warn { animation: pulseWarn 1.1s ease-in-out infinite; }
  .game-timer.pulse-danger { animation: pulseDanger 0.6s ease-in-out infinite; }
  @keyframes pulseCalm { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes pulseWarn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes pulseDanger { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .pace-label { font-size: 8px; letter-spacing: 1px; margin-top: 1px; height: 10px; font-weight: 700; }

  .hud-row { width: 100%; max-width: 320px; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .game-progress-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.5); overflow: hidden; }
  .game-progress-fill { height: 100%; border-radius: 3px; background: #FFB7B2; width: 0%; transition: width 0.25s ease; }
  .game-count { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12px; color: #3A3944; min-width: 40px; text-align: right; }

  .game-field { position: relative; flex: 1; margin: 4px 12px 16px; }
  .game-field.shake, .shake { animation: shakescreen 0.35s ease; }
  @keyframes shakescreen {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }

  .num-btn {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; color: #5D5C61;
    box-shadow: 3px 6px 10px rgba(90,70,60,0.28);
    border: 2.5px solid transparent; box-sizing: border-box;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .glossy-shine {
    position: absolute; top: 9%; left: 18%; width: 30%; height: 15%;
    border-radius: 50%; background: rgba(255,255,255,0.65);
    transform: rotate(-20deg); pointer-events: none;
  }
  .num-btn.correct-pop { animation: numpop 0.32s ease forwards; pointer-events: none; }
  @keyframes numpop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.22); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .num-btn.wrong-flash { animation: numwrong 0.4s ease; }
  @keyframes numwrong {
    0%, 100% { filter: none; } 50% { filter: brightness(0.82) saturate(1.6); }
  }

  .burst-particle {
    position: absolute; pointer-events: none;
    animation: burst 0.55s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(0,0) scale(0.4) rotate(0deg); }
    18% { opacity: 1; transform: translate(calc(var(--tx) * 0.35), calc(var(--ty) * 0.35)) scale(1.3) rotate(var(--rot)); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.15) rotate(var(--rot)); }
  }
  .burst-ring {
    position: absolute; border-radius: 50%; pointer-events: none;
    border: 3px solid; box-sizing: border-box;
    animation: burstring 0.4s ease-out forwards;
  }
  @keyframes burstring {
    0% { opacity: 0.7; transform: scale(0.3); }
    100% { opacity: 0; transform: scale(2.4); }
  }

  .result-overlay {
    position: absolute; inset: 0; background: rgba(255,251,247,0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; z-index: 10;
  }
  .result-overlay.hidden { display: none; }
  .result-label { font-size: 13px; color: #5D5C61; font-weight: 700; letter-spacing: 2px; }
  .result-time { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 40px; color: #3A3944; }
  .result-best { font-size: 14px; color: #5D5C61; }
  .result-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; width: 100%; max-width: 220px; }
  .result-buttons button {
    border: none; border-radius: 14px; padding: 12px 22px;
    font-weight: 800; font-family: 'Baloo 2', sans-serif; font-size: 15px; cursor: pointer;
    width: 100%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-retry { background: #FFB7B2; color: #3A3944; }
  .btn-exit { background: #3A3944; color: #fff; }
  .btn-record { background: #C7CEEA; color: #3A3944; }
  .btn-record svg { width: 16px; height: 16px; }

  .pause-overlay {
    position: absolute; inset: 0; background: rgba(38,34,42,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  .pause-overlay.hidden { display: none; }
  .pause-card {
    background: #FFF6EE; border-radius: 20px; padding: 22px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
  }
  .pause-badge {
    width: 56px; height: 56px; border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle at 35% 30%, #E3E7F5, #C7CEEA 55%, #9FA9D9 100%);
    border: 2.5px solid #8590C7; box-shadow: 3px 6px 10px rgba(90,70,60,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .pause-buttons { display: flex; gap: 10px; }
  .pause-buttons button {
    border: none; border-radius: 14px; padding: 12px 22px;
    font-weight: 800; font-family: 'Baloo 2', sans-serif; font-size: 15px; cursor: pointer;
  }
  .btn-resume { background: #FFB7B2; color: #3A3944; }
  .btn-quit { background: #3A3944; color: #fff; }

  /* ---------- 서바이벌 게임 화면 ---------- */
  #scene-survival {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
    align-items: stretch; justify-content: flex-start;
  }
  .survival-wrap { position: relative; display: flex; flex-direction: column; height: 100%; }
  .survival-hud {
    display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0;
    padding: max(14px, env(safe-area-inset-top)) 16px 6px;
  }
  .survival-combo-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #D4553F; }
  .survival-combo { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; color: #3A3944; transition: color 0.2s ease; }
  .survival-combo.bump { animation: comboBump 0.25s ease; }
  @keyframes comboBump { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .survival-lives { display: flex; gap: 6px; margin-top: 2px; }
  .survival-life { width: 12px; height: 12px; border-radius: 50%; background: #FFB7B2; transition: background 0.2s ease, opacity 0.2s ease; }
  .survival-life.lost { background: transparent; border: 2px solid rgba(93,92,97,0.3); opacity: 0.6; }

  .survival-field { position: relative; flex: 1; margin: 4px 12px 16px; }

  .survival-number-wrap { position: absolute; display: flex; align-items: center; justify-content: center; }
  .survival-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .survival-ring circle { transition: none; }

  .survival-result-label { font-size: 13px; color: #5D5C61; font-weight: 700; letter-spacing: 2px; }
  .survival-result-combo { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 44px; color: #3A3944; }
  .survival-result-best { font-size: 14px; color: #5D5C61; }

  /* ---------- 반반 분할 (2인, 가로) ---------- */
  #scene-split {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
    align-items: stretch; justify-content: flex-start;
  }
  .split-wrap { position: relative; display: flex; flex-direction: row; height: 100%; }
  .split-half { flex: 1; position: relative; display: flex; flex-direction: column; }
  .split-half.p1 { background: rgba(255,183,178,0.22); }
  .split-half.p2 { background: rgba(181,234,215,0.22); }
  .split-divider { width: 3px; background: rgba(58,57,68,0.2); flex-shrink: 0; }
  .split-label {
    text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px;
    padding-top: max(12px, env(safe-area-inset-top)); letter-spacing: 1px;
  }
  .split-half.p1 .split-label, .split-half.p1 .split-count { color: #D4553F; }
  .split-half.p2 .split-label, .split-half.p2 .split-count { color: #3E9E7C; }
  .split-count { text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: #3A3944; }
  .split-field { flex: 1; position: relative; margin: 6px 10px 10px; }
  .split-pause {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; right: auto;
    transform: translateX(-50%); z-index: 6;
  }
  .split-result-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #3A3944; }
  .split-result-sub { font-size: 13px; color: #5D5C61; }

  /* ---------- 난투 뺏기 (2인, 가로) ---------- */
  #scene-steal {
    background: linear-gradient(160deg, #FFF3EC, #FDE0E5);
    align-items: stretch; justify-content: flex-start;
  }
  .steal-wrap { position: relative; display: flex; flex-direction: column; height: 100%; }
  .steal-hud {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 24px 6px;
  }
  .steal-score { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; text-align: center; width: 90px; }
  .steal-score.p1 { color: #D4553F; }
  .steal-score.p2 { color: #3E9E7C; }
  .steal-score-label { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; text-align: center; }
  .steal-score-label.p1 { color: #D4553F; }
  .steal-score-label.p2 { color: #3E9E7C; }
  .steal-mid { text-align: center; font-size: 12px; color: #5D5C61; }
  .steal-field { flex: 1; position: relative; margin: 4px 14px 14px; z-index: 2; }
  .steal-result-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #3A3944; }
  .steal-result-sub { font-size: 13px; color: #5D5C61; }

  /* ---------- 디버그 로그 패널 (문제 진단용, 항상 최상단 표시) ---------- */


  #debug-panel {
    position: fixed; left: 6px; bottom: 6px; z-index: 9999;
    max-width: 92vw; max-height: 30vh; overflow-y: auto;
    background: rgba(0,0,0,0.78); color: #9CD9BE;
    font-family: monospace; font-size: 10px; line-height: 1.4;
    padding: 6px 8px; border-radius: 8px; white-space: pre-wrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="debug-panel"></div>

(function(){

  // 다른 프로젝트(HyperElevator, taekwon-watermelon 등)와 동일한 패턴:
  // - 닉네임 -> 가짜 이메일(닉네임@players.popping20.app)로 Firebase Auth 로그인
  // - Firestore에 기록 저장, TOP 20은 Firestore 쿼리로 조회
  // - SDK는 CDN에서 동적 로드하고, 실패/타임아웃 시 localStorage 로컬 모드로 자연스럽게 폴백
  //   (카카오톡 인앱 브라우저 등에서 CDN이 막혀도 게임 자체는 멈추지 않도록)
  //
  // ⚠ 사용하려면 아래 firebaseConfig를 실제 Firebase 프로젝트 설정 값으로 교체하세요.
  //   (Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 에서 복사)
  //   교체하지 않으면(placeholder 상태) 자동으로 로컬(localStorage) 모드로만 동작합니다.
  const firebaseConfig = {
    apiKey: "AIzaSyCp7kEKZbg4PkeQi1GSEaSbVqJVHLmfC1w",
    authDomain: "popping20-101e5.firebaseapp.com",
    projectId: "popping20-101e5",
    storageBucket: "popping20-101e5.firebasestorage.app",
    messagingSenderId: "1073283246224",
    appId: "1:1073283246224:web:ce692669b4295c9fd91015",
    measurementId: "G-63GD7JRHJQ"
  };
  const FAKE_EMAIL_DOMAIN = 'players.popping20.app';
  const FIXED_PW_PREFIX = 'popping20-pw-'; // 닉네임 로그인 방식이라 실제 비밀번호 입력은 없음(다른 프로젝트와 동일 패턴)

  window.firebaseReady = false;
  window.firebaseUser = null;

  const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'REPLACE_ME';
  if (!isConfigured) {
    console.log('[popping20] Firebase 설정이 비어있어 로컬 모드로 동작합니다.');
  } else {
    let loaded = 0;
    const scripts = [
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'
    ];
    let timedOut = false;
    const timeoutId = setTimeout(() => {
      timedOut = true;
      console.warn('[popping20] Firebase 로드 타임아웃 - 로컬 모드로 전환');
    }, 4000);

    function onScriptLoaded() {
      loaded++;
      if (loaded === scripts.length && !timedOut) {
        clearTimeout(timeoutId);
        initFirebase();
      }
    }

    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = onScriptLoaded;
      s.onerror = () => { timedOut = true; console.warn('[popping20] Firebase SDK 로드 실패:', src); };
      document.head.appendChild(s);
    });

    function initFirebase() {
      try {
        firebase.initializeApp(firebaseConfig);
        window.firebaseReady = true;
        window.firebaseAuth = firebase.auth();
        window.firebaseDb = firebase.firestore();
      } catch (e) {
        console.warn('[popping20] Firebase 초기화 실패:', e);
        window.firebaseReady = false;
      }
    }
  }

  // 닉네임 -> Firebase 로그인 (계정 없으면 자동 생성)
  window.firebaseSignIn = function(nickname, onDone) {
    if (!window.firebaseReady) { onDone && onDone(false); return; }
    const email = encodeURIComponent(nickname).toLowerCase() + '@' + FAKE_EMAIL_DOMAIN;
    const password = FIXED_PW_PREFIX + nickname;
    window.firebaseAuth.signInWithEmailAndPassword(email, password)
      .then(cred => { window.firebaseUser = cred.user; onDone && onDone(true); })
      .catch(() => {
        window.firebaseAuth.createUserWithEmailAndPassword(email, password)
          .then(cred => { window.firebaseUser = cred.user; onDone && onDone(true); })
          .catch(err => { console.warn('[popping20] Firebase 로그인 실패:', err); onDone && onDone(false); });
      });
  };

  // 점수 저장 (기존 기록보다 좋을 때만 갱신)
  window.firebaseSaveScore = function(mode, nickname, value, higherIsBetter) {
    if (!window.firebaseReady || !window.firebaseDb) return;
    const ref = window.firebaseDb.collection('popping20_scores_' + mode).doc(nickname);
    ref.get().then(doc => {
      const prev = doc.exists ? doc.data().value : null;
      const better = prev == null || (higherIsBetter ? value > prev : value < prev);
      if (better) {
        ref.set({ nick: nickname, value: value, updatedAt: Date.now() });
      }
    }).catch(err => console.warn('[popping20] Firestore 저장 실패:', err));
  };

  // TOP 20 조회
  window.firebaseGetTop20 = function(mode, higherIsBetter, callback) {
    if (!window.firebaseReady || !window.firebaseDb) { callback(null); return; }
    window.firebaseDb.collection('popping20_scores_' + mode)
      .orderBy('value', higherIsBetter ? 'desc' : 'asc')
      .limit(20)
      .get()
      .then(snap => {
        const list = [];
        snap.forEach(doc => list.push(doc.data()));
        callback(list);
      })
      .catch(err => { console.warn('[popping20] Firestore 조회 실패:', err); callback(null); });
  };
})();
</script>

<script>
(function(){
  // ---------- 안전한 저장소 래퍼 ----------
  // 미리보기(샌드박스 iframe) 등 localStorage 접근이 막힌 환경에서도
  // 에러로 죽지 않고 메모리에 임시 저장해서 최소한 게임은 동작하도록 함
  const memoryStore = {};
  window.safeStorage = {
    get(key) {
      try { return localStorage.getItem(key); }
      catch (e) { return (key in memoryStore) ? memoryStore[key] : null; }
    },
    set(key, val) {
      try { localStorage.setItem(key, val); }
      catch (e) { memoryStore[key] = String(val); }
    }
  };
})();
</script>

<script>
(function(){
  // ---------- 사운드 엔진: 숫자가 사라질 때 나는 부드러운 '퐁' ----------
  // 오디오는 사용자 제스처(탭) 안에서 처음 생성/재개해야 iOS 사파리 등에서 재생이 막히지 않음
  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  window.playPopSound = function() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;

      const master = ctx.createGain();
      master.gain.value = 0.5;
      const comp = ctx.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(ctx.destination);

      // 톤: 살짝 높은 음에서 빠르게 떨어지는 사인파 ('퐁~' 몸통)
      const baseFreq = 620 + Math.random() * 90;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.45, now + 0.13);

      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.0001, now);
      oscGain.gain.exponentialRampToValueAtTime(0.7, now + 0.008);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      osc.connect(oscGain);
      oscGain.connect(master);
      osc.start(now);
      osc.stop(now + 0.18);

      // 텍스처: 아주 짧은 대역통과 노이즈로 '톡' 하는 질감을 더함
      const bufferSize = Math.floor(ctx.sampleRate * 0.05);
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 1200;
      noiseFilter.Q.value = 0.8;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.16, now + 0.005);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + 0.06);
    } catch (e) {
      // 오디오 미지원 환경은 조용히 무시 (게임 진행에는 지장 없음)
    }
  };

  // ---------- 잔잔한 배경음악 (패드 신스, 낮은 볼륨의 잔향) ----------
  let bgmNodes = null;
  let bgmOn = safeStorageBgmPref();

  function safeStorageBgmPref() {
    try { return localStorage.getItem('popping20_bgm') !== 'off'; }
    catch (e) { return true; }
  }
  function saveBgmPref(on) {
    try { localStorage.setItem('popping20_bgm', on ? 'on' : 'off'); } catch (e) {}
  }

  function startBgm() {
    if (bgmNodes) return; // 이미 재생 중
    const ctx = getAudioCtx();
    if (!ctx) return;

    const master = ctx.createGain();
    master.gain.value = 0.05; // 아주 잔잔하게
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    master.connect(filter);
    filter.connect(ctx.destination);

    // 필터를 아주 천천히 흔들어 은은하게 움직이는 느낌
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.05;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 250;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();

    // 코드 진행 (Cmaj7 -> Am7 -> Fmaj7 -> G) 를 천천히 반복
    const chords = [
      [261.63, 329.63, 392.00, 493.88],
      [220.00, 261.63, 329.63, 392.00],
      [174.61, 220.00, 261.63, 349.23],
      [196.00, 246.94, 293.66, 392.00]
    ];
    let chordIndex = 0;
    const oscillators = [];
    const chordGain = ctx.createGain();
    chordGain.gain.value = 1;
    chordGain.connect(master);

    function playChord(freqs) {
      const now = ctx.currentTime;
      const dur = 6.5;
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.22, now + 1.5);
        g.gain.linearRampToValueAtTime(0.0001, now + dur);
        osc.connect(g);
        g.connect(chordGain);
        osc.start(now);
        osc.stop(now + dur + 0.1);
        oscillators.push(osc);
      });
    }

    playChord(chords[0]);
    const interval = setInterval(() => {
      chordIndex = (chordIndex + 1) % chords.length;
      playChord(chords[chordIndex]);
    }, 6000);

    bgmNodes = { master, filter, lfo, interval };
  }

  function stopBgm() {
    if (!bgmNodes) return;
    try {
      clearInterval(bgmNodes.interval);
      bgmNodes.lfo.stop();
      bgmNodes.master.disconnect();
    } catch (e) {}
    bgmNodes = null;
  }

  window.toggleBgm = function() {
    bgmOn = !bgmOn;
    saveBgmPref(bgmOn);
    if (bgmOn) startBgm(); else stopBgm();
    return bgmOn;
  };
  window.isBgmOn = function() { return bgmOn; };

  // 첫 사용자 제스처(탭/클릭) 때 자동으로 배경음악 시작 (설정이 꺼져있지 않다면)
  function firstGestureStartBgm() {
    if (bgmOn) startBgm();
    document.removeEventListener('pointerdown', firstGestureStartBgm);
  }
  document.addEventListener('pointerdown', firstGestureStartBgm);
})();
</script>

<script>
(function(){
  // ---------- 태블릿 고정 프레임: 짧은 변 600px 이상이면 430x900 프레임을 화면에 맞춰 확대 ----------
  const FRAME_W = 430, FRAME_H = 900, TABLET_THRESHOLD = 600;
  const appEl = document.getElementById('app');

  function fitFrame() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const isTablet = Math.min(vw, vh) >= TABLET_THRESHOLD && !window.__duoActive;
    document.body.classList.toggle('tablet-frame', isTablet);
    if (isTablet) {
      const scale = Math.min(vw / FRAME_W, vh / FRAME_H);
      appEl.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    } else {
      appEl.style.transform = '';
    }
  }
  window.fitFrame = fitFrame;
  fitFrame();
  window.addEventListener('resize', fitFrame);
  window.addEventListener('orientationchange', fitFrame);
})();
</script>

  function formatTimeGlobal(sec) {

  // ---------- 공용 리더보드 저장 (닉네임별 최고 기록만 유지) ----------
  function addLeaderboardEntry(mode, nick, value, higherIsBetter) {
    const storageKey = 'popping20_leaderboard_' + mode;
    let list = [];
    try { list = JSON.parse(safeStorage.get(storageKey) || '[]'); } catch (e) { list = []; }
    const idx = list.findIndex(e => e.nick === nick);
    if (idx >= 0) {
      const better = higherIsBetter ? value > list[idx].value : value < list[idx].value;
      if (better) list[idx].value = value;
    } else {
      list.push({ nick: nick, value: value });
    }
    list.sort((a, b) => higherIsBetter ? b.value - a.value : a.value - b.value);
    list = list.slice(0, 50);
    safeStorage.set(storageKey, JSON.stringify(list));
  }
  window.addLeaderboardEntry = addLeaderboardEntry;

  const timeAttack = (function(){

    const colors = [

      { bg: '#F3C77A', light: '#FAE3B0', dark: '#D9A94E', border: '#C6923A' },

    let expected, startTime, timerHandle, finished, nickname, bestTime, paused, pauseStartedAt;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec - m * 60).toFixed(1).padStart(4, '0');

    function layoutNumbers() {
      // 기존 버블/오버레이 제외 노드 제거
      field.querySelectorAll('.num-btn').forEach(n => n.remove());

      // getBoundingClientRect()는 스케일 변환(태블릿 프레임) 이후의 화면상 크기를 반환해서
      // 그 값을 그대로 내부 좌표(px)로 쓰면 이중으로 확대되어 프레임 밖으로 나가버림.
      // offsetWidth/offsetHeight는 변환 이전의 로컬 좌표계 크기라 항상 정확함.
      let w = field.offsetWidth;
      let h = field.offsetHeight;
      dbg('layoutNumbers: field size = ' + w + 'x' + h);
      // 화면 전환 직후라 아직 크기가 안 잡혔으면 (0이면) app 전체 기준으로 대체
      if (w < 10 || h < 10) {
        const appEl = document.getElementById('app');
        w = appEl.offsetWidth - 24;
        h = appEl.offsetHeight - 140;
        dbg('크기 0이라 app 기준 대체: ' + w + 'x' + h);
      }
      const rect = { width: w, height: h };
      const size = Math.max(40, Math.min(rect.width, rect.height) * 0.15);
      const placed = [];

      for (let n = 1; n <= 20; n++) {
        let x, y, tries = 0;
        do {
          x = Math.random() * (rect.width - size);
          y = Math.random() * (rect.height - size);
          tries++;
        } while (tries < 40 && placed.some(p => Math.hypot(p.x - x, p.y - y) < size * 0.95));
        placed.push({ x, y });

        const el = document.createElement('div');
        el.className = 'num-btn';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.fontSize = (size * 0.46) + 'px';
        const c = colors[n % colors.length];
        el.style.background = 'radial-gradient(circle at 35% 30%, ' + c.light + ', ' + c.bg + ' 55%, ' + c.dark + ' 100%)';
        el.style.borderColor = c.border;
        el._colorSet = c;
        el.textContent = n;
        el.dataset.value = n;

        const shine = document.createElement('div');
        shine.className = 'glossy-shine';
        el.appendChild(shine);

        el.addEventListener('click', () => handleTap(el, n));
        field.appendChild(el);
      }
      dbg('layoutNumbers 완료: field 자식 수 = ' + field.children.length);
    }

    function spawnBurst(el) {
      // offsetLeft/Top은 el의 offsetParent(=field, position:relative) 기준 로컬 좌표라
      // 태블릿 프레임(스케일 변환) 여부와 무관하게 항상 정확함.
      const cx = el.offsetLeft + el.offsetWidth / 2;
      const cy = el.offsetTop + el.offsetHeight / 2;
      const color = (el._colorSet && el._colorSet.bg) || '#FFB7B2';

      // 충격파 링 (톡 터지는 느낌의 핵심)
      const ring = document.createElement('div');
      ring.className = 'burst-ring';
      const ringSize = el.offsetWidth * 0.9;
      ring.style.width = ringSize + 'px';
      ring.style.height = ringSize + 'px';
      ring.style.left = (cx - ringSize / 2) + 'px';
      ring.style.top = (cy - ringSize / 2) + 'px';
      ring.style.borderColor = color;
      field.appendChild(ring);
      setTimeout(() => ring.remove(), 420);

      // 파편 파티클: 원형 + 각진 조각 섞어서 더 터지는 느낌
      for (let i = 0; i < 11; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (Math.PI * 2 * i) / 11 + (Math.random() - 0.5) * 0.6;
        const dist = 28 + Math.random() * 40;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        const s = 3 + Math.random() * 6;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.background = color;
        // 절반은 동그란 파편, 절반은 각진 파편(사각형에 가까운 조각)으로 다양하게
        p.style.borderRadius = (i % 2 === 0) ? '50%' : '3px';
        field.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function handleTap(el, n) {
      if (finished) return;
      if (n === expected) {
        spawnBurst(el);
        if (window.playPopSound) window.playPopSound();
        el.classList.add('correct-pop');
        setTimeout(() => el.remove(), 320);
        expected++;
        updateProgress();
        if (expected > 20) finish();
      } else {
        el.classList.remove('wrong-flash');
        void el.offsetWidth;
        el.classList.add('wrong-flash');
        field.classList.remove('shake');
        void field.offsetWidth;
        field.classList.add('shake');
      }
    }

    function updateProgress() {
      const count = expected - 1;
      fillEl.style.width = (count / 20 * 100) + '%';
      countEl.textContent = count + ' / 20';
    }

    function setTension(state) {
      timerEl.classList.remove('pulse-calm', 'pulse-warn', 'pulse-danger');
      timerRing.classList.remove('warn', 'danger');
      if (state === 'warn') {
        timerEl.classList.add('pulse-warn');
        timerEl.style.color = '#E2A13A';
        timerRing.classList.add('warn');
        paceLabel.textContent = '● 페이스 근접';
        paceLabel.style.color = '#E2A13A';
      } else if (state === 'danger') {
        timerEl.classList.add('pulse-danger');
        timerEl.style.color = '#D4553F';
        timerRing.classList.add('danger');
        paceLabel.textContent = '● 페이스 초과!';
        paceLabel.style.color = '#D4553F';
      } else if (state === 'ahead') {
        timerEl.classList.add('pulse-calm');
        timerEl.style.color = '#3E9E7C';
        paceLabel.textContent = '● 페이스 여유';
        paceLabel.style.color = '#3E9E7C';
      } else {
        timerEl.classList.add('pulse-calm');
        timerEl.style.color = '#3A3944';
        paceLabel.textContent = '';
      }
    }

    function tick() {
      if (finished) return;
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = formatTime(elapsed);

      // 최고 기록이 있으면 지금까지의 진행 속도를 최고 기록 페이스와 비교해서 긴장감 연출
      // count+0.5를 기준으로 삼아서 첫 숫자를 누르기 전(count=0)에도
      // 시간이 지날수록 자연스럽게 긴장감이 올라가도록 함 (0으로 나누기 방지 겸용)
      const count = expected - 1;
      if (bestTime) {
        const expectedAtCount = bestTime * ((count + 2) / 20);
        const ratio = elapsed / Math.max(expectedAtCount, 0.001);
        if (ratio > 1.15) setTension('danger');
        else if (ratio > 0.95) setTension('warn');
        else setTension('ahead');
      } else {
        setTension('calm');
      }
    }

    function finish() {
      finished = true;
      clearInterval(timerHandle);
      const elapsed = (performance.now() - startTime) / 1000;
      const key = 'popping20_best_timeattack_' + nickname;
      const prevBest = parseFloat(safeStorage.get(key));
      let bestText;
      if (!prevBest || elapsed < prevBest) {
        safeStorage.set(key, elapsed);
        bestText = '🎉 신기록이에요!';
      } else {
        bestText = '최고 기록: ' + formatTime(prevBest);
      }
      if (window.addLeaderboardEntry) window.addLeaderboardEntry('timeattack', nickname, elapsed, false);
      if (window.firebaseSaveScore) window.firebaseSaveScore('timeattack', nickname, elapsed, false);
      resultTimeEl.textContent = formatTime(elapsed);
      resultBestEl.textContent = bestText;
      overlay.classList.remove('hidden');
    }

    function start(nick) {
      dbg('timeAttack.start 진입: ' + nick);
      nickname = nick;
      finished = false;
      paused = false;
      expected = 1;
      bestTime = parseFloat(safeStorage.get('popping20_best_timeattack_' + nick)) || null;
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      updateProgress();
      timerEl.textContent = '00:00.0';
      setTension('calm');
      clearInterval(timerHandle);
      try {
        layoutNumbers();
      } catch (err) {
        const errBox = document.createElement('div');
        errBox.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:13px;color:#5D5C61;';
        errBox.innerHTML = '화면을 불러오는 중 문제가 생겼어요.<br>다시 시도해주세요.<br><span style="font-size:10px;opacity:0.6;">(' + err.message + ')</span>';
        field.appendChild(errBox);
        return;
      }
      startTime = performance.now();
      timerHandle = setInterval(tick, 100);
    }

    function pauseGame() {
      if (finished || paused) return;
      paused = true;
      pauseStartedAt = performance.now();
      clearInterval(timerHandle);
      pauseOverlay.classList.remove('hidden');
    }

    function resumeGame() {
      if (!paused) return;
      paused = false;
      // 멈춰있던 시간만큼 시작 시각을 뒤로 밀어서, 경과 시간에 일시정지 구간이 포함되지 않게 함
      const pausedDuration = performance.now() - pauseStartedAt;
      startTime += pausedDuration;
      pauseOverlay.classList.add('hidden');
      timerHandle = setInterval(tick, 100);
    }

    document.getElementById('btn-retry').addEventListener('click', () => start(nickname));
    document.getElementById('btn-exit').addEventListener('click', () => {
      finished = true;
      clearInterval(timerHandle);
      showScene(sceneMode);
    });

    pauseBtn.addEventListener('click', pauseGame);
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-quit').addEventListener('click', () => {
      finished = true;
      paused = false;
      clearInterval(timerHandle);
      pauseOverlay.classList.add('hidden');
      showScene(sceneMode);
    });

    return { start };
  })();

  // ---------- 서바이벌 엔진 ----------
  const survivalGame = (function(){
    const field = document.getElementById('survival-field');
    const comboEl = document.getElementById('survival-combo');
    const livesWrap = document.getElementById('survival-lives');
    const lives = Array.from(livesWrap.querySelectorAll('.survival-life'));
    const overlay = document.getElementById('result-overlay-survival');
    const resultComboEl = document.getElementById('survival-result-combo');
    const resultBestEl = document.getElementById('survival-result-best');
    const pauseOverlay = document.getElementById('pause-overlay-survival');
    const pauseBtnEl = document.getElementById('pause-btn-survival');
    const colors = [
      { bg: '#FFB7B2', light: '#FFD9D5', dark: '#E8938C', border: '#D97C74' },
      { bg: '#F3C77A', light: '#FAE3B0', dark: '#D9A94E', border: '#C6923A' },
      { bg: '#B5EAD7', light: '#D9F5EA', dark: '#8FCDAF', border: '#6FB893' },
      { bg: '#C7CEEA', light: '#E3E7F5', dark: '#9FA9D9', border: '#8590C7' }
    ];

    const BASE_DURATION = 1600;
    const MIN_DURATION = 500;
    const STEP = 61;
    const MAX_LIVES = 3;

    let combo, maxCombo, livesLeft, nickname, finished, paused, currentDuration;
    let missTimeout, currentWrap, currentRing, currentCircumference, spawnedAt, pauseRemaining;

    function updateLives() {
      lives.forEach((el, i) => el.classList.toggle('lost', i >= livesLeft));
    }

    function updateCombo(bump) {
      comboEl.textContent = combo;
      if (bump) {
        comboEl.classList.remove('bump');
        void comboEl.offsetWidth;
        comboEl.classList.add('bump');
      }
    }

    function clearCurrent() {
      if (currentWrap) { currentWrap.remove(); currentWrap = null; currentRing = null; }
      clearTimeout(missTimeout);
    }

    function spawnBurstAt(cx, cy, color) {
      for (let i = 0; i < 9; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (Math.PI * 2 * i) / 9 + (Math.random() - 0.5) * 0.5;
        const dist = 26 + Math.random() * 34;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        const s = 3 + Math.random() * 5;
        p.style.width = s + 'px'; p.style.height = s + 'px';
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.background = color;
        p.style.borderRadius = (i % 2 === 0) ? '50%' : '3px';
        field.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function spawnNumber() {
      if (finished || paused) return;
      clearCurrent();

      let w = field.offsetWidth, h = field.offsetHeight;
      if (w < 10 || h < 10) {
        const wrapEl = document.querySelector('.survival-wrap');
        w = wrapEl.offsetWidth - 24; h = wrapEl.offsetHeight - 140;
      }
      const size = Math.max(64, Math.min(w, h) * 0.3);
      const x = Math.random() * Math.max(1, w - size);
      const y = Math.random() * Math.max(1, h - size);

      const wrap = document.createElement('div');
      wrap.className = 'survival-number-wrap';
      wrap.style.width = size + 'px';
      wrap.style.height = size + 'px';
      wrap.style.left = x + 'px';
      wrap.style.top = y + 'px';

      const c = colors[Math.floor(Math.random() * colors.length)];
      const r = size / 2 - 5;
      const circumference = 2 * Math.PI * r;
      const svgNS = 'http://www.w3.org/2000/svg';

      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
      svg.classList.add('survival-ring');

      const bgCircle = document.createElementNS(svgNS, 'circle');
      bgCircle.setAttribute('cx', size / 2); bgCircle.setAttribute('cy', size / 2); bgCircle.setAttribute('r', r);
      bgCircle.setAttribute('fill', 'none'); bgCircle.setAttribute('stroke', 'rgba(255,255,255,0.5)'); bgCircle.setAttribute('stroke-width', '6');
      svg.appendChild(bgCircle);

      const fgCircle = document.createElementNS(svgNS, 'circle');
      fgCircle.setAttribute('cx', size / 2); fgCircle.setAttribute('cy', size / 2); fgCircle.setAttribute('r', r);
      fgCircle.setAttribute('fill', 'none'); fgCircle.setAttribute('stroke', c.border); fgCircle.setAttribute('stroke-width', '6');
      fgCircle.setAttribute('stroke-linecap', 'round');
      fgCircle.setAttribute('stroke-dasharray', circumference);
      fgCircle.style.strokeDashoffset = '0';
      svg.appendChild(fgCircle);
      wrap.appendChild(svg);

      const numSize = size - 14;
      const numEl = document.createElement('div');
      numEl.className = 'num-btn';
      numEl.style.position = 'absolute';
      numEl.style.left = '7px'; numEl.style.top = '7px';
      numEl.style.width = numSize + 'px'; numEl.style.height = numSize + 'px';
      numEl.style.fontSize = (numSize * 0.42) + 'px';
      numEl.style.background = 'radial-gradient(circle at 35% 30%, ' + c.light + ', ' + c.bg + ' 55%, ' + c.dark + ' 100%)';
      numEl.style.borderColor = c.border;
      numEl.textContent = Math.ceil(Math.random() * 20);

      const shine = document.createElement('div');
      shine.className = 'glossy-shine';
      numEl.appendChild(shine);

      numEl.addEventListener('click', () => handleHit(numEl, c.bg));
      wrap.appendChild(numEl);
      field.appendChild(wrap);

      currentWrap = wrap;
      currentRing = fgCircle;
      currentCircumference = circumference;

      requestAnimationFrame(() => {
        fgCircle.style.transition = 'stroke-dashoffset ' + currentDuration + 'ms linear';
        fgCircle.style.strokeDashoffset = circumference;
      });

      spawnedAt = performance.now();
      missTimeout = setTimeout(handleMiss, currentDuration);
    }

    function handleHit(numEl, color) {
      if (finished || paused) return;
      clearTimeout(missTimeout);
      if (window.playPopSound) window.playPopSound();
      const wrap = numEl.parentElement;
      const cx = wrap.offsetLeft + numEl.offsetLeft + numEl.offsetWidth / 2;
      const cy = wrap.offsetTop + numEl.offsetTop + numEl.offsetHeight / 2;
      spawnBurstAt(cx, cy, color);
      numEl.classList.add('correct-pop');
      currentWrap = null; currentRing = null;
      setTimeout(() => wrap.remove(), 320);

      combo++;
      maxCombo = Math.max(maxCombo, combo);
      updateCombo(true);
      currentDuration = Math.max(MIN_DURATION, BASE_DURATION - combo * STEP);
      spawnNumber();
    }

    function handleMiss() {
      if (finished || paused) return;
      combo = 0;
      updateCombo(false);
      currentDuration = BASE_DURATION;
      livesLeft--;
      updateLives();
      clearCurrent();

      const wrapEl = document.querySelector('.survival-wrap');
      wrapEl.classList.remove('shake');
      void wrapEl.offsetWidth;
      wrapEl.classList.add('shake');

      if (livesLeft <= 0) finish();
      else spawnNumber();
    }

    function finish() {
      finished = true;
      clearTimeout(missTimeout);
      clearCurrent();
      const key = 'popping20_best_survival_' + nickname;
      const prevBest = parseFloat(safeStorage.get(key));
      let bestText;
      if (!prevBest || maxCombo > prevBest) {
        safeStorage.set(key, maxCombo);
        bestText = '🎉 신기록이에요!';
      } else {
        bestText = '최고 콤보: ' + prevBest;
      }
      if (window.addLeaderboardEntry) window.addLeaderboardEntry('survival', nickname, maxCombo, true);
      if (window.firebaseSaveScore) window.firebaseSaveScore('survival', nickname, maxCombo, true);
      resultComboEl.textContent = maxCombo;
      resultBestEl.textContent = bestText;
      overlay.classList.remove('hidden');
    }

    function start(nick) {
      nickname = nick;
      finished = false;
      paused = false;
      combo = 0; maxCombo = 0; livesLeft = MAX_LIVES; currentDuration = BASE_DURATION;
      updateCombo(false);
      updateLives();
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      clearCurrent();
      spawnNumber();
    }

    function pauseGame() {
      if (finished || paused) return;
      paused = true;
      clearTimeout(missTimeout);
      const elapsedSinceSpawn = performance.now() - spawnedAt;
      pauseRemaining = Math.max(50, currentDuration - elapsedSinceSpawn);
      if (currentRing) {
        const cs = getComputedStyle(currentRing);
        const frozen = cs.strokeDashoffset;
        currentRing.style.transition = 'none';
        currentRing.style.strokeDashoffset = frozen;
      }
      pauseOverlay.classList.remove('hidden');
    }

    function resumeGame() {
      if (!paused) return;
      paused = false;
      pauseOverlay.classList.add('hidden');
      if (currentRing) {
        requestAnimationFrame(() => {
          currentRing.style.transition = 'stroke-dashoffset ' + pauseRemaining + 'ms linear';
          currentRing.style.strokeDashoffset = currentCircumference;
        });
        spawnedAt = performance.now() - (currentDuration - pauseRemaining);
        missTimeout = setTimeout(handleMiss, pauseRemaining);
      } else {
        spawnNumber();
      }
    }

    document.getElementById('btn-retry-survival').addEventListener('click', () => start(nickname));
    document.getElementById('btn-exit-survival').addEventListener('click', () => {
      finished = true;
      clearTimeout(missTimeout);
      clearCurrent();
      showScene(sceneMode);
    });
    pauseBtnEl.addEventListener('click', pauseGame);
    document.getElementById('btn-resume-survival').addEventListener('click', resumeGame);
    document.getElementById('btn-quit-survival').addEventListener('click', () => {
      finished = true;
      paused = false;
      clearTimeout(missTimeout);
      pauseOverlay.classList.add('hidden');
      showScene(sceneMode);
    });

    return { start };
  })();

  // ---------- 반반 분할 엔진 ----------
  const splitGame = (function(){
    const field1 = document.getElementById('split-field-1');
    const field2 = document.getElementById('split-field-2');
    const count1El = document.getElementById('split-count-1');
    const count2El = document.getElementById('split-count-2');

    const resultLabelEl = document.getElementById('split-result-label');
    const pauseOverlay = document.getElementById('pause-overlay-split');

    const coral = { bg: '#FFB7B2', light: '#FFD9D5', dark: '#E8938C', border: '#D97C74' };
    const mint = { bg: '#B5EAD7', light: '#D9F5EA', dark: '#8FCDAF', border: '#6FB893' };

    let expected1, expected2, finished, paused;

    function layoutHalf(field, c) {
      field.querySelectorAll('.num-btn').forEach(n => n.remove());
      let w = field.offsetWidth, h = field.offsetHeight;
      if (w < 10 || h < 10) { w = 150; h = 400; }
      const size = Math.max(34, Math.min(w, h) * 0.17);
      const placed = [];
      for (let n = 1; n <= 20; n++) {
        let x, y, tries = 0;
        do {
          x = Math.random() * Math.max(1, w - size);
          y = Math.random() * Math.max(1, h - size);
          tries++;
        } while (tries < 40 && placed.some(p => Math.hypot(p.x - x, p.y - y) < size * 0.9));
        placed.push({ x, y });

        const el = document.createElement('div');
        el.className = 'num-btn';
        el.style.width = size + 'px'; el.style.height = size + 'px';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.fontSize = (size * 0.44) + 'px';
        el.style.background = 'radial-gradient(circle at 35% 30%, ' + c.light + ', ' + c.bg + ' 55%, ' + c.dark + ' 100%)';
        el.style.borderColor = c.border;
        el.textContent = n;
        el.dataset.value = n;
        const shine = document.createElement('div');
        shine.className = 'glossy-shine';
        el.appendChild(shine);
        el.addEventListener('click', () => handleTap(field === field1 ? 1 : 2, el, n, c.bg));
        field.appendChild(el);
      }
    }

    function handleTap(side, el, n, color) {
      if (finished || paused) return;
      const expected = side === 1 ? expected1 : expected2;
      if (n === expected) {
        const container = side === 1 ? field1 : field2;
        spawnBurstGeneric(el, container, color);
        if (window.playPopSound) window.playPopSound();
        el.classList.add('correct-pop');
        setTimeout(() => el.remove(), 320);
        if (side === 1) {
          expected1++;
          count1El.textContent = (expected1 - 1) + ' / 20';
          if (expected1 > 20) finish(1);
        } else {
          expected2++;
          count2El.textContent = (expected2 - 1) + ' / 20';
          if (expected2 > 20) finish(2);
        }
      } else {
        el.classList.remove('wrong-flash');
        void el.offsetWidth;
        el.classList.add('wrong-flash');
      }
    }

    function finish(winner) {
      finished = true;
      resultLabelEl.textContent = winner + 'P 승리!';
      overlay.classList.remove('hidden');
    }

    function start() {
      finished = false;
      paused = false;
      expected1 = 1; expected2 = 1;
      count1El.textContent = '0 / 20';
      count2El.textContent = '0 / 20';
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      layoutHalf(field1, coral);

  // ---------- 난투 뺏기 엔진 (색상 소유권 방식) ----------
  // 1P=코랄, 2P=민트로 각자 1~20을 미리 정해두고 하나의 화면에 40개를 섞어 배치.
  // 판정이 "터치 위치"가 아니라 "그 숫자가 원래 누구 색이었는가"로 고정되므로
  // 위치 운이 개입되지 않고, 뒤섞인 화면에서 내 색을 빠르게 찾는 순발력 대결이 됨.
  const stealGame = (function(){
    const field = document.getElementById('steal-field');
    const score1El = document.getElementById('steal-score-1');
    const score2El = document.getElementById('steal-score-2');
    const overlay = document.getElementById('result-overlay-steal');
    const resultLabelEl = document.getElementById('steal-result-label');
    const resultSubEl = document.getElementById('steal-result-sub');
    const pauseOverlay = document.getElementById('pause-overlay-steal');
    const pauseBtnEl = document.getElementById('pause-btn-steal');

    const coral = { bg: '#FFB7B2', light: '#FFD9D5', dark: '#E8938C', border: '#D97C74' };
    const mint = { bg: '#B5EAD7', light: '#D9F5EA', dark: '#8FCDAF', border: '#6FB893' };

    let expected1, expected2, finished, paused;

    function layoutNumbers() {
      field.querySelectorAll('.num-btn').forEach(n => n.remove());
      let w = field.offsetWidth, h = field.offsetHeight;
      if (w < 10 || h < 10) { w = 500; h = 260; }
      // 40개(1P 20개 + 2P 20개)가 들어가야 하니 시간 어택보다 살짝 작게
      const size = Math.max(34, Math.min(w, h) * 0.12);
      const placed = [];

      // 1..20을 1P/2P 각각 하나씩, 총 40개를 섞어서 배치
      const items = [];
      for (let n = 1; n <= 20; n++) {
        items.push({ n, owner: 1 });
        items.push({ n, owner: 2 });
      }
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }

      items.forEach(item => {
        let x, y, tries = 0;
        do {
          x = Math.random() * Math.max(1, w - size);
          y = Math.random() * Math.max(1, h - size);
          tries++;
        } while (tries < 40 && placed.some(p => Math.hypot(p.x - x, p.y - y) < size * 0.9));
        placed.push({ x, y });

        const c = item.owner === 1 ? coral : mint;
        const el = document.createElement('div');
        el.className = 'num-btn';
        el.style.width = size + 'px'; el.style.height = size + 'px';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.fontSize = (size * 0.42) + 'px';
        el.style.background = 'radial-gradient(circle at 35% 30%, ' + c.light + ', ' + c.bg + ' 55%, ' + c.dark + ' 100%)';
        el.style.borderColor = c.border;
        el.textContent = item.n;
        el.dataset.value = item.n;
        el.dataset.owner = item.owner;
        const shine = document.createElement('div');
        shine.className = 'glossy-shine';
        el.appendChild(shine);
        el.addEventListener('click', () => handleTap(el, item.n, item.owner, c.bg));
        field.appendChild(el);
      });
    }

    function handleTap(el, n, owner, color) {
      if (finished || paused) return;
      const expected = owner === 1 ? expected1 : expected2;
      if (n !== expected) {
        el.classList.remove('wrong-flash');
        void el.offsetWidth;
        el.classList.add('wrong-flash');
        return;
      }
      if (window.playPopSound) window.playPopSound();
      spawnBurstGeneric(el, field, color);
      el.classList.add('correct-pop');
      setTimeout(() => el.remove(), 320);

      if (owner === 1) {
        expected1++;
        score1El.textContent = (expected1 - 1) + ' / 20';
        if (expected1 > 20) finish(1);
      } else {
        expected2++;
        score2El.textContent = (expected2 - 1) + ' / 20';
        if (expected2 > 20) finish(2);
      }
    }

    function finish(winner) {
      finished = true;
      resultLabelEl.textContent = winner + 'P 승리!';
      resultSubEl.textContent = '먼저 내 색 20개를 다 찾았어요';
      overlay.classList.remove('hidden');
    }

    function start() {
      finished = false; paused = false;
      expected1 = 1; expected2 = 1;
      score1El.textContent = '0 / 20';
      score2El.textContent = '0 / 20';
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      layoutNumbers();
    }

    function pauseGame() {
      if (finished || paused) return;
      paused = true;
      pauseOverlay.classList.remove('hidden');
    }
    function resumeGame() {
      if (!paused) return;
      paused = false;
      pauseOverlay.classList.add('hidden');
    }

    document.getElementById('btn-retry-steal').addEventListener('click', () => start());
    document.getElementById('btn-exit-steal').addEventListener('click', () => {
      finished = true;
      showScene(sceneMode);
    });
    pauseBtnEl.addEventListener('click', pauseGame);
    document.getElementById('btn-resume-steal').addEventListener('click', resumeGame);
    document.getElementById('btn-quit-steal').addEventListener('click', () => {
      finished = true;
      paused = false;
      pauseOverlay.classList.add('hidden');
      showScene(sceneMode);
    });

    return { start };
  })();
})();
</script>

</body>
</html>
